
name: ci-cd

on:
    workflow_dispatch
  # push:
  #   branches:
  #     - main

jobs:
  
  secrets-scan:
        uses: ./.github/workflows/secrets-scan.yml
        secrets: inherit
  
  docker-scan:
        uses: ./.github/workflows/doc_lint.yml
  
  build:
    needs: [ secrets-scan, docker-scan ]
    uses: ./.github/workflows/docker_b_p.yml
    secrets: inherit 

  trivy:
         needs: [build]
         uses: ./.github/workflows/image-scan.yml
         secrets: inherit
  
  INFRASTRUCTURE :
        needs: [trivy]
        uses: ./.github/workflows/infra.yml
        secrets: inherit
