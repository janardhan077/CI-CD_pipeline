
name: docker publish

on:
  workflow_call:

jobs:
  dokcer_build_push:
    runs-on: ubuntu-latest
    environment: docker_sec
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_NAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build & Push to Docker Hub the assistant_service
        uses: docker/build-push-action@v6
        with:
          context: ./microservices/services/assistant_service
          file: ./microservices/services/assistant_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAME }}/assistant_service:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_NAME }}/assistant_service:latest
            ${{ secrets.DOCKERHUB_NAME }}/assistant_service:${{ github.sha }}

      - name: Build & Push to Docker Hub the cashbank_service
        uses: docker/build-push-action@v6
        with:
          context: ./microservices/services/cashbank_service
          file: ./microservices/services/cashbank_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAME }}/cashbank_service:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_NAME }}/cashbank_service:latest
            ${{ secrets.DOCKERHUB_NAME }}/cashbank_service:${{ github.sha }}

      - name: Build & Push to Docker Hub the credit_service
        uses: docker/build-push-action@v6
        with:
          context: ./microservices/services/credit_service
          file: ./microservices/services/credit_service/Dockerfile
          push: true
          tags: |
