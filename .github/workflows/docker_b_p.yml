      - name: Build & Push to Docker Hub the report_service
        uses: docker/build-push-action@v6
        with:
          context: ./microservices/services/report_service
          file: ./microservices/services/report_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAME }}/report_service:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_NAME }}/report_service:latest
            ${{ secrets.DOCKERHUB_NAME }}/report_service:${{ github.sha }}

      - name: Build & Push to Docker Hub the sales_service
        uses: docker/build-push-action@v6
        with:
          context: ./microservices/services/sales_service
          file: ./microservices/services/sales_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAME }}/sales_service:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_NAME }}/sales_service:latest
            ${{ secrets.DOCKERHUB_NAME }}/sales_service:${{ github.sha }}

      - name: Build & Push to Docker Hub the stock_service
        uses: docker/build-push-action@v6
