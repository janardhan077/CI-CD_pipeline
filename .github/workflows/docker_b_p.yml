            ${{ secrets.DOCKERHUB_NAME }}/stock_service:${{ github.sha }}

      - name: Build & Push to Docker Hub the gateway
        uses: docker/build-push-action@v6
        with:
          context: ./microservices/gateway
          file: ./microservices/gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAME }}/gateway:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_NAME }}/gateway:latest
            ${{ secrets.DOCKERHUB_NAME }}/gateway:${{ github.sha }}