          file: ./microservices/services/expense_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAME }}/expense_service:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_NAME }}/expense_service:latest
            ${{ secrets.DOCKERHUB_NAME }}/expense_service:${{ github.sha }}

      - name: Build & Push to Docker Hub the ledger_service
        uses: docker/build-push-action@v6
        with:
          context: ./microservices/services/ledger_service
          file: ./microservices/services/ledger_service/Dockerfile
          push: true
