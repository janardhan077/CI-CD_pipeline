name: Docker Lint

on:
  workflow_call:

jobs:
  validate-dockerfiles:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dockerfile:
        - "microservices/services/assistant_service/Dockerfile"
        - "microservices/services/cashbank_service/Dockerfile"
        - "microservices/services/credit_service/Dockerfile"
        - "microservices/services/expense_service/Dockerfile"
        - "microservices/services/ledger_service/Dockerfile"
        - "microservices/services/report_service/Dockerfile"
        - "microservices/services/sales_service/Dockerfile"
        - "microservices/services/stock_service/Dockerfile"
        - "microservices/gateway/Dockerfile"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}