worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Service DNS names come from docker-compose service names.
    upstream sales_service     { server sales-service:8000; }
    upstream credit_service    { server credit-service:8000; }
    upstream expense_service   { server expense-service:8000; }
    upstream stock_service     { server stock-service:8000; }
    upstream cashbank_service  { server cashbank-service:8000; }
    upstream ledger_service    { server ledger-service:8000; }
    upstream report_service    { server report-service:8000; }
    upstream assistant_service { server assistant-service:8000; }

    server {
        listen 8000;

        # ------------------------------------------------------------
        # Gateway's own health check.
        # ------------------------------------------------------------
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # ------------------------------------------------------------
        # Business services - path prefix maps 1:1 to the monolith's
        # original router prefixes, so static/app.js needs NO changes.
        # ------------------------------------------------------------
        location /sales {
            proxy_pass http://sales_service;
            proxy_set_header Host $host;
        }

        location /customers {
            proxy_pass http://credit_service;
            proxy_set_header Host $host;
        }

        location /expenses {
            proxy_pass http://expense_service;
            proxy_set_header Host $host;
        }

        location /stock {
            proxy_pass http://stock_service;
            proxy_set_header Host $host;
        }

        location /cashbank {
            proxy_pass http://cashbank_service;
            proxy_set_header Host $host;
        }

        # Ledger service is exposed for admin/debugging (e.g. tracing
        # "why is cash X" via /ledger/transactions?reference_table=...).
        # Nothing in the UI calls this directly.
        location /ledger/ {
            rewrite ^/ledger/(.*)$ /$1 break;
            proxy_pass http://ledger_service;
            proxy_set_header Host $host;
        }

        location /reports {
            proxy_pass http://report_service;
            proxy_set_header Host $host;
        }

        # The Assistant calls Ollama itself and can take a while on a
        # cold model load - give it more room than the other services.
        location /assistant {
            proxy_pass http://assistant_service;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }

        # ------------------------------------------------------------
        # Not built in this pass (see README "Scope" section) - Excel
        # import/export was left in the monolith. Return a clear 501
        # instead of a confusing 502/404.
        # ------------------------------------------------------------
        location ~ ^/(excel) {
            default_type application/json;
            return 501 '{"error":"NotImplemented","detail":"This module has not been split into a microservice yet - see README Scope section."}';
        }

        # ------------------------------------------------------------
        # Static frontend - identical to the monolith's StaticFiles
        # mount + FileResponse("static/index.html").
        # ------------------------------------------------------------
        location /static/ {
            alias /usr/share/nginx/html/static/;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
        }
    }
}
